name: Godot Web Preview

on:
  push:
    branches:
      - godot-3d-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Godot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Web export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O export_templates.tpz
          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Parse project headless from clean cache
        shell: bash
        run: |
          set -o pipefail
          rm -rf godot/.godot
          godot --headless --path godot --editor --quit 2>&1 | tee parse.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Attempt to connect nonexistent signal' parse.log; then
            echo 'Godot parse diagnostics found; failing CI.'
            exit 1
          fi

      - name: Run vertical slice smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Attempt to connect nonexistent signal|SMOKE FAIL:' smoke.log; then
            echo 'Godot vertical-slice smoke diagnostics found; failing CI.'
            exit 1
          fi
          grep -q 'SMOKE PASS:' smoke.log

          godot --headless --path godot --script res://tests/dormitory_smoke_test.gd 2>&1 | tee dormitory-smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Attempt to connect nonexistent signal|DORMITORY SMOKE FAIL:' dormitory-smoke.log; then
            echo 'Godot dormitory smoke diagnostics found; failing CI.'
            exit 1
          fi
          grep -q 'DORMITORY SMOKE PASS:' dormitory-smoke.log

      - name: Run Day 1 integration smoke tests
        shell: bash
        run: |
          set -o pipefail
          timeout 180 godot --headless --path godot --script res://tests/day_smoke_test.gd 2>&1 | tee day-smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|DAY SMOKE FAIL:' day-smoke.log; then
            exit 1
          fi
          grep -q 'DAY SMOKE PASS:' day-smoke.log

      - name: Run survival and area unlock integration tests
        shell: bash
        run: |
          set -o pipefail
          timeout 90 godot --headless --path godot --script res://tests/survival_smoke_test.gd 2>&1 | tee survival.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SURVIVAL FAIL:' survival.log; then
            exit 1
          fi
          grep -q 'SURVIVAL PASS:' survival.log

      - name: Run living base integration tests
        shell: bash
        run: |
          set -o pipefail
          timeout 180 godot --headless --path godot --script res://tests/base_smoke_test.gd 2>&1 | tee base.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|BASE FAIL:' base.log; then
            exit 1
          fi
          grep -q 'BASE PASS:' base.log

      - name: Render mobile visual review captures
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a godot --path godot --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/visual_capture.gd 2>&1 | tee visual.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|VISUAL FAIL:' visual.log; then
            exit 1
          fi
          grep -q 'VISUAL PASS:' visual.log

      - name: Render living base mobile captures
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a godot --path godot --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/base_visual_capture.gd 2>&1 | tee base-visual.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|BASE VISUAL FAIL:' base-visual.log; then
            exit 1
          fi
          grep -q 'BASE VISUAL PASS:' base-visual.log

      - name: Upload visual review captures
        uses: actions/upload-artifact@v4
        with:
          name: protocol-zero-visual-review
          path: /tmp/pz-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Export Web build with cache-busted asset names
        shell: bash
        run: |
          set -o pipefail
          rm -rf web-build
          mkdir -p web-build
          SHORT_SHA="${GITHUB_SHA::8}"
          BASENAME="protocol-zero-${SHORT_SHA}"
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/web-build/${BASENAME}.html" 2>&1 | tee export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Attempt to connect nonexistent signal' export.log; then
            echo 'Godot export diagnostics found; failing CI.'
            exit 1
          fi
          test -f "web-build/${BASENAME}.html"
          cp "web-build/${BASENAME}.html" web-build/index.html
          printf '%s\n' "$SHORT_SHA" > web-build/build-id.txt
          touch web-build/.nojekyll
          ls -lah web-build

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: protocol-zero-web-preview
          path: web-build/
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview into existing GitHub Pages site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          rm -rf /tmp/protocol-zero-pages
          git worktree add --detach /tmp/protocol-zero-pages origin/main
          rm -rf /tmp/protocol-zero-pages/godot-preview
          mkdir -p /tmp/protocol-zero-pages/godot-preview
          cp -a web-build/. /tmp/protocol-zero-pages/godot-preview/
          cd /tmp/protocol-zero-pages
          git add godot-preview
          if git diff --cached --quiet; then
            echo "Preview unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore: publish Godot web preview [skip ci]"
          git push origin HEAD:main

